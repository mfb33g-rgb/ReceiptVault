name: Build ReceiptVault APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o ReceiptVaultAndroid_v0.2_build_ready.zip -d buildsrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: buildsrc/ReceiptVaultAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ReceiptVault-APK
          path: buildsrc/ReceiptVaultAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
